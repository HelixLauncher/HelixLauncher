[package]
name = "helixlauncher-cli"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Helix Launcher CLI"

[[bin]]
name = "hxmc"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.95", features = ["backtrace"] }
clap = { version = "4.5.29", features = ["env", "derive"] }
clap-verbosity-flag = "3.0.2"
log = { version = "0.4.25", features = ["serde"] }
pretty_env_logger = "0.5.0"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "fs", "process"] }
helixlauncher-core = { version = "0.1.0", path = "../helixlauncher-core" }
inquire = "0.9.4"
