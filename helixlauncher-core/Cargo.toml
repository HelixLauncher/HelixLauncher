[package]
name = "helixlauncher-core"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true

[features]
ffi = ["dep:cbindgen"]

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
indexmap = "2.7.1"
reqwest = { version = "0.13.4", features = ["json", "form"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["rt", "macros", "process", "fs"] }
helixlauncher-meta = { version = "0.1.0", git = "https://github.com/HelixLauncher/meta.git" }
dirs = "6.0.0"
regex = "1.11.1"
lazy_static = "1.5.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
digest = "0.11.3"
hex = "0.4.3"
zip = "0.6.5"                                                                                 # TODO: update
anyhow = "1.0.86"                                                                             # FIXME: remove
futures = "0.3.31"
tempfile-fast = "0.3.6"                                                                       # can't replace with tempfile because we use it to create unnamed tempfiles to move to a download target

[build-dependencies]
cbindgen = { version = "0.29.0", optional = true }

[dev-dependencies]
tempfile = "3.16.0"
